name: devshare

services:
  devshare:
    image: ghcr.io/zimengxiong/devshare:v0.3.12-endeavour
    build:
      context: ../..
    container_name: devshare
    restart: unless-stopped
    env_file: /srv/state/devshare/runtime.env
    volumes:
      - /srv/state/devshare/data:/var/lib/devshare
    networks:
      - proxy

networks:
  proxy:
    external: true
